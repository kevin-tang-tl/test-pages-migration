server {
    listen       80;
    server_name  _;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Dynamic mapping: /org/site → /usr/share/nginx/html/sites/org/site
    location ~ ^/([^/]+)/([^/]+)(/.*)?$ {
        root /usr/share/nginx/html/sites;
        index index.html;

        # $1 = org folder, $2 = site folder, $3 = rest of path
        # Example: /orgA/site1/about.html → /usr/share/nginx/html/sites/orgA/site1/about.html
        try_files /$1/$2$3 /$1/$2/index.html =404;
    }

    # Optional root fallback
    location / {
        root /usr/share/nginx/html/sites;
        index index.html;
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml;
    gzip_min_length 256;
}
